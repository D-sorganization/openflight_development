name: quality-gate

on:
  push:
    # Queue branches are covered by merge_group; a push run there would duplicate
    # the required check (or cancel it, under cancel-in-progress) (RM#1900).
    branches-ignore: ["gh-readonly-queue/**"]
  pull_request:
  # Merge queue (Repository_Management#1890): required checks must report on the queue's merge commit.
  merge_group:

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene
        run: |
          set -euo pipefail
          test -f README.md
          echo "README present"
          if grep -rn --include='*.md' -E '^(<{7}|>{7}|={7})( |$)' . ; then
            echo "Merge conflict markers found" >&2
            exit 1
          fi
          echo "No merge-conflict markers"
          # Every tracked markdown file must be non-empty
          empty=$(find . -name '*.md' -not -path './.git/*' -empty | wc -l)
          if [ "$empty" -ne 0 ]; then
            find . -name '*.md' -not -path './.git/*' -empty >&2
            echo "Empty markdown files found" >&2
            exit 1
          fi
          echo "No empty markdown files"
